# Aula Site — despliegue en Render (blueprint)
services:
  - type: web
    name: aulasite-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aulasite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  - type: static
    name: aulasite-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://aulasite-backend.onrender.com/api

databases:
  - name: aulasite-db
    databaseName: aulasite
    plan: free
